[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.97"

[workspace.dependencies]
steward-proto = { path = "crates/steward-proto" }
steward-index = { path = "crates/steward-index" }
steward-classify = { path = "crates/steward-classify" }
steward-contentid = { path = "crates/steward-contentid" }
steward-log = { path = "crates/steward-log" }
anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
ignore = "0.4"
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
tokio = { version = "1.53", features = ["full"] }
tracing = "0.1"
toml = "0.9"
turso = "0.8.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"

# gpui-pre-macros leaves a helper ungated in release builds (see disktree).
[profile.release.package.gpui-pre-macros]
debug-assertions = true
