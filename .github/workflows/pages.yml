# Builds the documentation site (site/) with pandoc and publishes it to
# GitHub Pages. Repository settings → Pages → Source must be "GitHub Actions".
name: Pages

on:
  push:
    branches: [master, main]
    paths:
      - "site/**"
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PANDOC_VERSION: "3.7.0.2"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install pandoc
        run: |
          curl -fsSL -o pandoc.deb \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo dpkg -i pandoc.deb
          pandoc --version | head -1

      - name: Build
        run: site/build.sh _site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
